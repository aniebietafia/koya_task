services:
  - type: web
    name: lead-triage-system
    env: python
    buildCommand: uv sync --frozen && uv cache prune --ci
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false

  # Render Cron Service running src/tasks.py every 10 minutes
  - type: cron
    name: keep-app-awake
    schedule: "*/10 * * * *"
    command: python src/tasks.py || true
